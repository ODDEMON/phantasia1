<!doctype html>

<title>残像 · AFTERIMAGE</title>

<body data-world="interval">

<div id="stage"></div>
<div id="ring" aria-hidden="true"><i class="halo"></i><i class="r2"></i><i class="r1"></i><i class="core"></i><i class="k a"></i><i class="k b"></i><i class="k c"></i><i class="k d"></i></div>

<div id="frame">
  <div class="brand"><span class="bt">残像</span><span class="bs">AFTERIMAGE</span></div>

    <button id="btnSound" title="默认不出声。要按一下才出。">放开声音</button>
    <button id="btnSave" title="把这一趟的走法存成一段，随时接回来。">存个档</button>
  </div>
</div>
